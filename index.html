<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Student Skill Exchange — a university platform for peer tutoring and skill sharing."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e3a8a'/%3E%3Cpath d='M16 7l9 4.5-9 4.5-9-4.5z' fill='white'/%3E%3Cpath d='M11 15v4c0 1.5 2.2 2.8 5 2.8s5-1.3 5-2.8v-4l-5 2.5z' fill='%2338bdf8'/%3E%3C/svg%3E"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Student Skill Exchange</title>
    <!--
      Apply the saved theme before first paint to avoid a flash of the
      default theme. Kept inline + minimal on purpose; the canonical logic
      lives in src/store/theme.js and re-applies on boot.
    -->
    <script>
      (function () {
        try {
          var VALID_PRESETS = [
            'riverside',
            'midnight',
            'forest',
            'lavender',
            'sunset',
            'contrast',
          ];
          var VALID_MODES = ['light', 'dark', 'system'];
          var saved = {};
          try {
            saved = JSON.parse(localStorage.getItem('sse:appearance')) || {};
          } catch (e) {}
          var preset =
            VALID_PRESETS.indexOf(saved.preset) !== -1
              ? saved.preset
              : 'riverside';
          var mode =
            VALID_MODES.indexOf(saved.mode) !== -1 ? saved.mode : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          var root = document.documentElement;
          root.setAttribute('data-theme-preset', preset);
          root.setAttribute('data-theme', resolved);
          if (resolved === 'dark') root.classList.add('theme-dark');
          root.style.colorScheme = resolved;
        } catch (e) {
          /* fall back to default Riverside Blue */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
